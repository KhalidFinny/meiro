name: Release

# Publish a GitHub release for a tag such as v0.2.0. It runs only after the
# CI workflow passes on that tag's commit, so no release builds from
# unchecked code. Run it by hand to build without publishing.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Refuse to build unless the CI run that triggered this tested the exact
  # commit a version tag points at. Any other CI completion (a branch push,
  # a pull request) ends here with nothing to release.
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the tested commit
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: building without publishing."
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Find the version tag on the tested commit
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags="$(git tag --points-at HEAD --list 'v*')"
          count="$(echo "$tags" | grep -c . || true)"
          if [ "$count" = "0" ]; then
            echo "No version tag on ${{ steps.resolve.outputs.sha }}; nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          elif [ "$count" != "1" ]; then
            echo "Several version tags point at this commit; refusing an ambiguous release:"
            echo "$tags"
            exit 1
          else
            echo "tag=$tags" >> "$GITHUB_OUTPUT"
            echo "version=${tags#v}" >> "$GITHUB_OUTPUT"
            echo "Releasing $tags"
          fi

  version:
    needs: gate
    if: needs.gate.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Check the tag matches mygo.json
        run: |
          want="v$(jq -r .version mygo.json)"
          test "${{ needs.gate.outputs.tag }}" = "$want" || {
            echo "Tag ${{ needs.gate.outputs.tag }} does not match mygo.json version $want."
            exit 1
          }
          echo "Version OK: ${{ needs.gate.outputs.version }}"

  build:
    needs: [gate, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, target: darwin/arm64, os: macos-latest }
          - { platform: darwin-amd64, target: darwin/amd64, os: macos-latest }
          - { platform: linux-amd64, target: linux/amd64, os: ubuntu-latest }
          - { platform: linux-arm64, target: linux/arm64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The tag is the version: v1.2.3 builds as 1.2.3.
      - name: Set the version
        run: |
          version="${{ needs.gate.outputs.version }}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          jq --arg v "$version" '.version = $v' mygo.json > mygo.json.new
          mv mygo.json.new mygo.json

      - name: Fetch ffmpeg and yt-dlp
        run: scripts/fetch-tools.sh "${{ matrix.platform }}"

      - name: Build
        run: go tool mygo build -platform "${{ matrix.target }}" -o dist

      - name: Set up Linux package tools
        if: startsWith(matrix.platform, 'linux-')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Collect the downloads
        run: |
          mkdir artifacts
          arch="${{ matrix.platform }}"; arch="${arch#*-}"
          case "${{ matrix.platform }}" in
            darwin-*)
              dmg="$(find "dist/${{ matrix.platform }}" -maxdepth 1 -name '*.dmg')"
              cp "$dmg" "artifacts/Meiro-${VERSION}-macos-${arch}.dmg"
              ;;
            linux-*)
              scripts/package-linux.sh "${{ matrix.platform }}" "$VERSION" artifacts
              ;;
          esac
          ls -la artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: meiro-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: needs.gate.outputs.tag != ''
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ needs.gate.outputs.tag }}" artifacts/* --title "Meiro ${{ needs.gate.outputs.version }}" --generate-notes --verify-tag
